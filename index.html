
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmeSuyHician ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe5ef, #ffd1e3);
      font-family: Arial, sans-serif;
      color: #a83d69;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.8);
      padding: 40px 30px;
      margin: 20px;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(180,70,110,0.15);
      max-width: 500px;
    }
    h1 { font-size: 36px; }
    p { font-size: 18px; line-height: 1.6; }
    .heart { font-size: 60px; }
    button {
      background: #ff6b9d;
      color: white;
      padding: 14px 24px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #e94e86; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Welcome to AmeSuyHician</h1>
    <p>Chào mừng bạn đến với website của mình!</p>
    <p>Một góc nhỏ xinh trên Internet.</p>
    <button onclick="sayHello()">Nhấn vào đây ❤️</button>
  </div>

  <script>
    function sayHello() {
      alert("Cảm ơn bạn đã ghé thăm ❤️");
    }
  </script>
</body>
</html>
